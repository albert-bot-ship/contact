<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>contact control</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="m-orb-mid" aria-hidden="true"></div>

<header>
  <div class="topo" aria-hidden="true"></div>
  <div class="logo">
    <div class="lic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
    <span>contact control</span>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab" id="tabDashboard" onclick="setView('dashboard')">儀表板</button>
    <button class="nav-tab active" id="tabCases" onclick="setView('cases')">案件</button>
    <button class="nav-tab" id="tabDir" onclick="setView('directory')">名冊</button>
    <button class="nav-tab" id="tabSchedule" onclick="setView('schedule')">期程總覽</button>
    <button class="nav-tab" id="tabSettings" onclick="setView('settings')">設定</button>
  </div>
  <div class="hsp"></div>
  <button class="hbtn hbtn-icon" onclick="exportJSON()" title="匯出 JSON 備份">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </button>
  <button class="hbtn hbtn-icon" onclick="document.getElementById('importInput').click()" title="匯入 JSON 備份">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
  </button>
  <div class="ds-pill ds-loading" id="dsPill">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span id="dsPillText">讀取中…</span>
  </div>
  <div class="pill" id="sunrisePill" style="display:none">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
    <span id="sunriseText"></span>
  </div>
  <div class="pill" id="storagePill">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
    <span id="storageText">—</span>
    <div class="sbar"><div class="sfill" id="storageFill"></div></div>
  </div>
  <div class="tg">
    <button class="tb" id="btnAuto"  onclick="setThemeMode('auto')">自動</button>
    <button class="tb" id="btnLight" onclick="setThemeMode('light')">淺色</button>
    <button class="tb" id="btnDark"  onclick="setThemeMode('dark')">深色</button>
  </div>
</header>

<!-- Toolbar (changes by view) -->
<div class="toolbar" id="toolbar"></div>

<!-- Main layout -->
<div class="layout" id="mainLayout">
  <div class="lp" id="lp">
    <div class="lp-top" id="lpTop"></div>
    <div class="lp-list" id="lpList"></div>
    <div class="lp-bottom" id="lpBottom"></div>
  </div>
  <div class="rp" id="rp">
    <div class="rp-empty"><div class="rp-empty-icon">📋</div><p class="rp-empty-txt">點選左側查看詳情</p></div>
  </div>
</div>

<!-- Case Modal -->
<div class="mo" id="caseModal">
  <div class="md">
    <div class="mh"><span class="mt" id="caseMT">新增案件</span><button class="mcl" onclick="closeMo('caseModal')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="mb">
      <input type="hidden" id="caseId">
      <div class="fg"><label class="fl">案件名稱 <span class="fr">*</span></label><input class="fi" id="caseName" placeholder="例：○○廠 環境影響評估"></div>
      <div class="frow">
        <div class="fg"><label class="fl">案件類別</label><select class="fs" id="caseCat"></select></div>
        <div class="fg"><label class="fl">案件狀態</label>
          <select class="fs" id="caseStatus">
            <option value="進行中">進行中</option>
            <option value="待辦">待辦</option>
            <option value="暫停">暫停</option>
            <option value="結案">結案</option>
          </select>
        </div>
      </div>
      <div class="fg"><label class="fl">備註</label><input class="fi" id="caseNote" placeholder="選填"></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeMo('caseModal')">取消</button><button class="btn btn-p" onclick="saveCase()">儲存</button></div>
  </div>
</div>

<!-- Global Contact Modal (Directory) -->
<div class="mo" id="gContactModal">
  <div class="md">
    <div class="mh"><span class="mt" id="gContactMT">新增聯絡人</span><button class="mcl" onclick="closeMo('gContactModal')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="mb">
      <input type="hidden" id="gCtId">
      <div class="frow">
        <div class="fg"><label class="fl">姓名 <span class="fr">*</span></label><input class="fi" id="gCtName" placeholder="王小明"></div>
        <div class="fg"><label class="fl">身份 / 職位</label><input class="fi" id="gCtRole" placeholder="業主、承辦…"></div>
      </div>
      <div class="fg"><label class="fl">角色類別</label><input class="fi" id="gCtType" placeholder="業主、下包（空品監測）、規劃團隊…"></div>
      <div class="fg"><label class="fl">說明</label><textarea class="fta" id="gCtDesc" placeholder="負責範疇、對接事項…"></textarea></div>
      <div class="frow">
        <div class="fg"><label class="fl">電話</label><input class="fi" id="gCtPhone" type="tel" placeholder="0900-000-000"></div>
        <div class="fg"><label class="fl">Email</label><input class="fi" id="gCtEmail" type="email" placeholder="example@mail.com"></div>
      </div>
      <div class="fg"><label class="fl">LINE ID</label><input class="fi" id="gCtLine" placeholder="選填"></div>
      <div class="fg"><label class="fl">備註</label><textarea class="fta" id="gCtNote" placeholder="其他補充…" style="min-height:52px"></textarea></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeMo('gContactModal')">取消</button><button class="btn btn-p" onclick="saveGContact()">儲存</button></div>
  </div>
</div>

<!-- Case Contact Ref Modal (with autocomplete picker) -->
<div class="mo" id="refModal">
  <div class="md">
    <div class="mh"><span class="mt" id="refMT">新增聯絡人</span><button class="mcl" onclick="closeMo('refModal')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="mb">
      <input type="hidden" id="refId">
      <input type="hidden" id="refCaseId">
      <input type="hidden" id="refPickedGId">
      <div class="fsection-label">── 基本資料（來自名冊或新建）</div>
      <div class="frow">
        <div class="fg">
          <label class="fl">姓名 <span class="fr">*</span></label>
          <div class="ac-wrap">
            <input class="fi" id="refName" placeholder="輸入姓名搜尋名冊…" autocomplete="off" oninput="onRefNameInput(this.value)" onblur="hideAcDelay()">
            <div class="ac-dropdown" id="refAcDrop"></div>
          </div>
          <div class="linked-indicator" id="refLinked">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            已連結名冊 · 修改將同步更新
          </div>
        </div>
        <div class="fg"><label class="fl">身份 / 職位</label><input class="fi" id="refRole" placeholder="業主、承辦…"></div>
      </div>
      <div class="fg"><label class="fl">角色類別</label><input class="fi" id="refType" placeholder="業主、下包（空品監測）、規劃團隊…"></div>
      <div class="fg"><label class="fl">說明</label><textarea class="fta" id="refDesc" placeholder="負責範疇、對接事項…"></textarea></div>
      <div class="frow">
        <div class="fg"><label class="fl">電話</label><input class="fi" id="refPhone" type="tel"></div>
        <div class="fg"><label class="fl">Email</label><input class="fi" id="refEmail" type="email"></div>
      </div>
      <div class="fg"><label class="fl">LINE ID</label><input class="fi" id="refLine" placeholder="選填"></div>
      <div class="fg"><label class="fl">備註（全域）</label><textarea class="fta" id="refGNote" placeholder="此人的一般備注…" style="min-height:52px"></textarea></div>
      <hr class="fdivider">
      <div class="fsection-label">── 此案件專屬</div>
      <div class="fg"><label class="fl">案件備注</label><input class="fi" id="refCaseNote" placeholder="此人在此案件的特別說明…"></div>
      <label class="fck"><input type="checkbox" id="refPrimary"> 設為此案件的主要聯絡人</label>
    </div>
    <div class="mf"><button class="btn" onclick="closeMo('refModal')">取消</button><button class="btn btn-p" onclick="saveRef()">儲存</button></div>
  </div>
</div>

<!-- Milestone Modal -->
<div class="mo" id="msModal">
  <div class="md">
    <div class="mh"><span class="mt" id="msMT">新增期程</span><button class="mcl" onclick="closeMo('msModal')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="mb">
      <input type="hidden" id="msId"><input type="hidden" id="msCaseId">
      <div class="fg" id="msCaseField" style="display:none">
        <label class="fl">歸屬 <span class="fr">*</span></label>

      </div>
      <div class="frow">
        <div class="fg"><label class="fl">名稱 <span class="fr">*</span></label><input class="fi" id="msLabel" placeholder="送件期限、審查會議…"></div>
      </div>
      <div class="frow">
        <div class="fg"><label class="fl">開始日 <span class="fr">*</span></label><input class="fi" id="msDate" type="date" onchange="if(document.getElementById('msEndDate').value<this.value)document.getElementById('msEndDate').value=this.value"></div>

      </div>
    </div>
    <div class="mf"><button class="btn" onclick="closeMo('msModal')">取消</button><button class="btn btn-p" onclick="saveMilestone()">儲存</button></div>
  </div>
</div>

<!-- Log Modal -->
<div class="mo" id="logModal">
  <div class="md">
    <div class="mh"><span class="mt" id="logMT">新增聯絡記錄</span><button class="mcl" onclick="closeMo('logModal')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="mb">
      <input type="hidden" id="logId"><input type="hidden" id="logCaseId"><input type="hidden" id="logRefId">
      <div class="fg"><label class="fl">日期 <span class="fr">*</span></label><input class="fi" id="logDate" type="date"></div>
      <div class="fg"><label class="fl">記錄內容 <span class="fr">*</span></label><textarea class="fta" id="logContent" placeholder="電話確認、信件往來、會議內容…" style="min-height:100px"></textarea></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeMo('logModal')">取消</button><button class="btn btn-p" onclick="saveLog()">儲存</button></div>
  </div>
</div>

<!-- Login Overlay -->
<div id="loginOverlay" style="display:none">
  <div class="lo-orb1"></div>
  <div class="lo-orb2"></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="lic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--ac)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>

    <div class="login-subtitle" id="loginSubtitle"></div>
    <div class="pwd-wrap">

<!-- Set Password Modal -->
<div class="mo" id="setPwdModal">
  <div class="md" style="max-width:400px">
    <div class="mh"><span class="mt" id="setPwdMT">設定密碼</span><button class="mcl" onclick="closeMo('setPwdModal')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="mb">
      <div class="fg">
        <label class="fl">新密碼</label>
        <div class="pwd-wrap" style="margin-bottom:0">
          <input type="password" class="fi" id="newPwd1" placeholder="請輸入新密碼（至少 4 字元）" autocomplete="new-password">
          <button class="pwd-toggle" onclick="togglePwdView('newPwd1',this)" tabindex="-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="fg">
        <label class="fl">確認密碼</label>

  </div>

<input type="file" id="importInput" accept=".json" style="display:none" onchange="importJSON(event)">
<div id="toast"></div>

<script>
/* ── Constants ── */
const SK='ccv6';
const DEF_CATS=['環評','環差','監測','許可申請','土污','廢棄物','溫室氣體','其他'];
const BASE_COL={'環評':[99,140,255],'環差':[167,110,210],'監測':[34,197,155],'許可申請':[250,168,36],'土污':[240,80,80],'廢棄物':[128,140,164],'溫室氣體':[52,207,142],'其他':[128,140,164]};
const STATUS_CLS={進行中:'s-active',待辦:'s-pending',暫停:'s-paused',結案:'s-closed'};
const COMPANY_ID='__company__';
function companyMsItems(){return(db.companyMilestones||[]).map(m=>({...m,caseId:COMPANY_ID,caseName:'公司期程',caseCategory:null,isCompany:true}));}
function catCol(cat){if(!cat)return['var(--acd)','var(--ac)'];if(BASE_COL[cat]){const[r,g,b]=BASE_COL[cat];return[`rgba(${r},${g},${b},.22)`,`rgb(${r},${g},${b})`];}let h=0;for(let i=0;i<cat.length;i++)h=(h*37+cat.charCodeAt(i))%360;return[`hsla(${h},60%,64%,.22)`,`hsl(${h},60%,64%)`];}

/* ── State ── */
let db={categories:[...DEF_CATS],contacts:[],cases:[],categoryStageTemplates:{},companyMilestones:[]};
let view='cases',selId=null,selDirId=null;
let sortKey='newest',filterCat='',filterStatus='',searchCaseQ='',searchCtQ='';
const stageOpenIds=new Set();
function toggleStageOpen(caseId){
  if(stageOpenIds.has(caseId))stageOpenIds.delete(caseId);else stageOpenIds.add(caseId);
  renderCasesRP();
}
let themeMode=localStorage.getItem('themeMode')||'auto';
let acHideTimer=null;
let calMonth=(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};})();

/* ── Storage ── */
function loadData(){
  try{
    const r=localStorage.getItem(SK);if(r)db=JSON.parse(r);
    if(!db.categories)db.categories=[...DEF_CATS];
    if(!db.contacts)db.contacts=[];
    if(!db.categoryStageTemplates)db.categoryStageTemplates={};
    if(!db.companyMilestones)db.companyMilestones=[];
    db.cases.forEach(c=>{
      if(!c.status)c.status='進行中';
      if(!c.milestones)c.milestones=[];
      if(!c.stages)c.stages=[];
      if(c.memo==null)c.memo='';
      if(!c.createdAt)c.createdAt=Date.now();
      // Migrate old contacts[] → contactRefs[]
      if(c.contacts&&!c.contactRefs){
        c.contactRefs=c.contacts.map(ct=>{
          let gct=db.contacts.find(g=>g.name===ct.name&&(g.phone===ct.phone||(!g.phone&&!ct.phone)));
          if(!gct){gct={id:ct.id||uid(),name:ct.name||'',role:ct.role||'',contactType:ct.contactType||'',description:ct.description||'',phone:ct.phone||'',email:ct.email||'',note:ct.note||'',createdAt:Date.now()};db.contacts.push(gct);}
          return{id:uid(),contactId:gct.id,primary:!!ct.primary,caseNote:'',logs:ct.logs||[]};
        });
        delete c.contacts;
      }
      if(!c.contactRefs)c.contactRefs=[];
    });
  }catch{db={categories:[...DEF_CATS],contacts:[],cases:[],categoryStageTemplates:{},companyMilestones:[]};}
}
function cleanDb(){
  return{categories:db.categories,contacts:db.contacts,categoryStageTemplates:db.categoryStageTemplates||{},companyMilestones:db.companyMilestones||[],cases:db.cases.map(c=>{
    const{_x,...r}=c;
    return{...r,contactRefs:(r.contactRefs||[]).map(ref=>{const{_logsOpen,...rr}=ref;return rr;})};
  })};
}
function saveData(){localStorage.setItem(SK,JSON.stringify(cleanDb()));updateStorage();}
function updateStorage(){
  const bytes=new TextEncoder().encode(localStorage.getItem(SK)||'').length;
  const kb=(bytes/1024).toFixed(1);const pct=Math.min(100,(bytes/(5*1024*1024))*100);
  document.getElementById('storageText').textContent=`${kb} KB / 5 MB`;
  const f=document.getElementById('storageFill');f.style.width=pct.toFixed(1)+'%';
  f.style.background=pct>80?'var(--err)':pct>50?'var(--warn)':'var(--ac)';
  if(pct>70)showToast(`⚠ LocalStorage 已使用 ${pct.toFixed(0)}%，建議匯出備份`,'warn');
}

/* ── Theme ── */
function getSunTimes(){const s=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});const[yr,mo,dy]=s.split('-').map(Number);const day=Math.round((new Date(yr,mo-1,dy)-new Date(yr,0,0))/86400000);const lat=24.1477*Math.PI/180;const decl=-23.45*Math.cos(2*Math.PI/365*(day+10))*Math.PI/180;const cosH=-Math.tan(lat)*Math.tan(decl);const H=Math.acos(Math.max(-1,Math.min(1,cosH)))*180/Math.PI;const noon=12-(120.6736-120)/15;return{rH:noon-H/15,sH:noon+H/15};}
function hhmm(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60)%60;return`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;}
function applyTheme(){let dark=false;const pill=document.getElementById('sunrisePill');if(themeMode==='dark'){dark=true;pill.style.display='none';}else if(themeMode==='light'){dark=false;pill.style.display='none';}else{const{rH,sH}=getSunTimes();const tw=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}));const cur=tw.getHours()+tw.getMinutes()/60;dark=cur<rH||cur>=sH;document.getElementById('sunriseText').textContent=`台中 日出 ${hhmm(rH)} · 日落 ${hhmm(sH)}`;pill.style.display='flex';}document.documentElement.setAttribute('data-theme',dark?'dark':'light');}
function setThemeMode(mode){themeMode=mode;localStorage.setItem('themeMode',mode);applyTheme();document.querySelectorAll('.tb').forEach(b=>b.classList.remove('active'));document.getElementById({auto:'btnAuto',light:'btnLight',dark:'btnDark'}[mode]).classList.add('active');}

/* ── Utils ── */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function hl(t,q){if(!q)return esc(t);const e=esc(t),eq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return e.replace(new RegExp(eq,'gi'),m=>`<mark>${m}</mark>`);}
function ini(n){const c=[...(n||'').trim()];return c.length>=2?c[0]+c[c.length-1]:c[0]||'?';}
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
function urgency(d){const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);const diff=(x-t)/86400000;return diff<0?'overdue':diff<=7?'urgent':diff<=30?'soon':'normal';}
function msEnd(m){return m.endDate||m.date;}
function msDateStr(m){return m.endDate&&m.endDate!==m.date?`${m.date} ～ ${m.endDate}`:m.date;}
function dateRangeArr(start,end){const out=[];let d=new Date(start+'T00:00:00');const e=new Date((end||start)+'T00:00:00');let guard=0;while(d<=e&&guard<730){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');out.push(`${y}-${m}-${dd}`);d.setDate(d.getDate()+1);guard++;}return out;}
function nearestMs(c){const t=new Date();t.setHours(0,0,0,0);const f=(c.milestones||[]).filter(m=>{const e=new Date(msEnd(m));e.setHours(0,0,0,0);return e>=t;}).map(m=>new Date(m.date).getTime());return f.length?Math.min(...f):Infinity;}
function getGContact(ref){return db.contacts.find(c=>c.id===ref.contactId)||{name:'(已刪除)',phone:'',email:'',lineId:'',role:'',contactType:'',description:'',note:''};}

function visCases(){
  let cs=db.cases;
  if(filterCat)cs=cs.filter(c=>c.category===filterCat);
  if(filterStatus)cs=cs.filter(c=>c.status===filterStatus);
  if(searchCaseQ){
    const q=searchCaseQ.toLowerCase();
    cs=cs.filter(c=>
      c.name.toLowerCase().includes(q)||
      (c.note||'').toLowerCase().includes(q)||
      (c.memo||'').toLowerCase().includes(q)||
      (c.contactRefs||[]).some(ref=>(ref.caseNote||'').toLowerCase().includes(q)||(ref.logs||[]).some(l=>l.content.toLowerCase().includes(q)))
    );
  }
  if(searchCtQ){const q=searchCtQ.toLowerCase();cs=cs.filter(c=>(c.contactRefs||[]).some(ref=>getGContact(ref).name.toLowerCase().includes(q)));}
  return sortArr(cs);
}
function sortArr(a){
  const arr=[...a];
  if(sortKey==='newest')return arr.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
  if(sortKey==='oldest')return arr.sort((x,y)=>(x.createdAt||0)-(y.createdAt||0));
  if(sortKey==='name')return arr.sort((x,y)=>x.name.localeCompare(y.name,'zh-TW'));
  if(sortKey==='cat')return arr.sort((x,y)=>(x.category||'').localeCompare(y.category||'','zh-TW'));
  if(sortKey==='ms')return arr.sort((x,y)=>nearestMs(x)-nearestMs(y));
  if(sortKey==='status'){
    const order={進行中:0,待辦:1,暫停:2,結案:3};
    return arr.sort((x,y)=>(order[x.status||'進行中']??9)-(order[y.status||'進行中']??9)||x.name.localeCompare(y.name,'zh-TW'));
  }
  return arr;
}

function nextMsInfo(c){
  const mss=(c.milestones||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!mss.length)return null;
  const t=new Date();t.setHours(0,0,0,0);
  const upcoming=mss.find(m=>{const x=new Date(msEnd(m));x.setHours(0,0,0,0);return x>=t;});
  return upcoming||mss[mss.length-1];
}
function stageProgressInfo(c){
  const st=c.stages||[];if(!st.length)return null;
  return{done:st.filter(s=>s.done).length,total:st.length};
}

/* ══ 期程總覽（跨案件月曆） ══ */
let calSelDay=null;
function mUrgCol(date){
  const urg=urgency(date);
  if(urg==='overdue')return'var(--mpw-r)';
  if(urg==='urgent'||urg==='soon')return'var(--mpw-p)';
  return'var(--mpw-b)';
}
function renderSchedule(){
  const rp=document.getElementById('rp');
  const allMs=[];db.cases.forEach(c=>{(c.milestones||[]).forEach(m=>{allMs.push({...m,caseId:c.id,caseName:c.name,caseCategory:c.category});});});allMs.push(...companyMsItems());
  const{y,m}=calMonth;
  const first=new Date(y,m,1);const startDow=first.getDay();const daysInMonth=new Date(y,m+1,0).getDate();
  const byDate={};allMs.forEach(ms=>{dateRangeArr(ms.date,msEnd(ms)).forEach(ds=>{if(!byDate[ds])byDate[ds]=[];byDate[ds].push(ms);});});
  const todayStr=today();
  let cells='';
  for(let i=0;i<startDow;i++)cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=(startDow+d-1)%7;
    const items=(byDate[dateStr]||[]).sort((a,b)=>urgencyRank(msEnd(a))-urgencyRank(msEnd(b)));
    const shown=items.slice(0,2).map(it=>{const col=mUrgCol(msEnd(it));return`<div class="cal-event" style="background:${col}22;color:${col}" title="點擊編輯：${esc(it.caseName)} · ${esc(it.label)} · ${msDateStr(it)}" onclick="event.stopPropagation();openMsModal('${it.caseId}','${it.id}')"><span style="font-weight:800">${esc(it.caseName)}</span>：${esc(it.label)}</div>`;}).join('');
    const more=items.length>2?`<span class="cal-more">+${items.length-2} 筆</span>`:'';
    const cls=['cal-cell'];
    if(dow===0||dow===6)cls.push('weekend');
    if(dateStr===todayStr)cls.push('today');
    if(dateStr===calSelDay)cls.push('sel');
    const dayClick=items.length?`showCalDay('${dateStr}',event)`:`openMsModalForDate('${dateStr}')`;
    cells+=`<div class="${cls.join(' ')}" onclick="${dayClick}"><span class="cal-daynum">${d}</span><div class="cal-events">${shown}${more}</div></div>`;
  }
  const dows=['日','一','二','三','四','五','六'];
  const years=[];for(let yy=new Date().getFullYear()-20;yy<=new Date().getFullYear()+20;yy++)years.push(yy);
  rp.innerHTML=`<div class="sched-wrap">
    <div class="cal-head">
      <div class="cal-title-group">
        <select class="cal-jump" onchange="calJumpYear(this.value)">${years.map(yy=>`<option value="${yy}" ${yy===y?'selected':''}>${yy} 年</option>`).join('')}</select>
        <select class="cal-jump" onchange="calJumpMonth(this.value)">${Array.from({length:12},(_,i)=>i).map(mm=>`<option value="${mm}" ${mm===m?'selected':''}>${mm+1} 月</option>`).join('')}</select>
      </div>
      <div class="cal-nav">
        <button class="btn btn-xs" onclick="calNav(-1)">‹ 上月</button>
        <button class="btn btn-xs" onclick="calNav(0)">今天</button>
        <button class="btn btn-xs" onclick="calNav(1)">下月 ›</button>
      </div>
    </div>
    <div class="cal-mstripe"></div>
    <div class="cal-legend" style="justify-content:space-between">
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <span class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--mpw-r)"></span>已逾期</span>
        <span class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--mpw-p)"></span>30天內</span>
        <span class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--mpw-b)"></span>尚早</span>
      </div>
      <button class="btn btn-xs" onclick="openMsModalForDate('')"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新增期程</button>
    </div>
    <div class="cal-grid">${dows.map((d,i)=>`<div class="cal-dow ${i===0||i===6?'weekend':''}">${d}</div>`).join('')}${cells}</div>
    <div id="calDayDetail"></div>
    <div class="sched-list-title" style="justify-content:space-between"><span style="display:flex;align-items:center;gap:6px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>所有期程（依日期排序）</span><button class="btn btn-xs" onclick="openMsModalForDate('')"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新增期程</button></div>
    <div style="font-size:11px;color:var(--txf);margin:-4px 0 8px">點月曆上任一天，或點下方清單裡的期程，都能直接編輯</div>
    <div id="schedFullList"></div>
  </div>`;
  if(calSelDay)showCalDay(calSelDay);
  if(!allMs.length){document.getElementById('schedFullList').innerHTML=`<div class="dash-empty">尚無期程，點上方「新增期程」即可新增</div>`;return;}
  renderSchedFullList(allMs);
}
function urgencyRank(d){const u=urgency(d);return u==='overdue'?0:u==='urgent'?1:u==='soon'?2:3;}
function calNav(dir){
  if(dir===0){const d=new Date();calMonth={y:d.getFullYear(),m:d.getMonth()};}
  else{let{y,m}=calMonth;m+=dir;if(m<0){m=11;y--;}if(m>11){m=0;y++;}calMonth={y,m};}
  calSelDay=null;renderSchedule();
}
function calJumpYear(val){calMonth={...calMonth,y:parseInt(val)};calSelDay=null;renderSchedule();}
function calJumpMonth(val){calMonth={...calMonth,m:parseInt(val)};calSelDay=null;renderSchedule();}
function schedItemHtml(m){
  const dotCol=mUrgCol(msEnd(m));
  const headerHtml=m.isCompany
    ?`<span class="sched-item-case company-tag">🏢 公司期程</span>`
    :`<span class="sched-item-case" onclick="event.stopPropagation();setView('cases');selCase('${m.caseId}')">${esc(m.caseName)}</span>${m.caseCategory?`<span class="cat-badge" style="background:${catCol(m.caseCategory)[0]};color:${catCol(m.caseCategory)[1]}">${esc(m.caseCategory)}</span>`:''}`;
  return`<div class="sched-item" onclick="openMsModal('${m.caseId}','${m.id}')" title="點擊編輯此期程">
    <div class="sched-item-dot" style="background:${dotCol};box-shadow:0 0 7px ${dotCol}"></div>
    <div class="sched-item-date">${msDateStr(m)}</div>

      <button class="ibtn" onclick="event.stopPropagation();openMsModal('${m.caseId}','${m.id}')" title="編輯"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
      <button class="ibtn del" onclick="event.stopPropagation();deleteMilestone('${m.caseId}','${m.id}')" title="刪除"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
  </div>`;
}
function showCalDay(dateStr,ev){
  calSelDay=dateStr;
  if(ev){
    document.querySelectorAll('.cal-cell').forEach(el=>el.classList.remove('sel'));
    ev.currentTarget?.classList.add('sel');
  }
  const inRange=m=>dateStr>=m.date&&dateStr<=msEnd(m);
  const items=[];db.cases.forEach(c=>{(c.milestones||[]).forEach(m=>{if(inRange(m))items.push({...m,caseId:c.id,caseName:c.name,caseCategory:c.category});});});
  items.push(...companyMsItems().filter(inRange));
  const el=document.getElementById('calDayDetail');if(!el)return;
  const titleRow=`<div class="sched-list-title" style="justify-content:space-between"><span>${dateStr}</span><button class="btn btn-xs" onclick="openMsModalForDate('${dateStr}')"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新增期程</button></div>`;
  el.innerHTML=items.length?`${titleRow}${items.map(schedItemHtml).join('')}`:`${titleRow}<div class="dash-empty">當天沒有期程</div>`;
}
function renderSchedFullList(allMs){
  const sorted=[...allMs].sort((a,b)=>a.date.localeCompare(b.date));
  const grouped={};sorted.forEach(m=>{const mo=m.date.substring(0,7);if(!grouped[mo])grouped[mo]=[];grouped[mo].push(m);});
  const html=Object.entries(grouped).map(([month,items])=>{
    const[y,mm]=month.split('-');
    return`<div class="timeline-month"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${y} 年 ${parseInt(mm)} 月</div>${items.map(schedItemHtml).join('')}`;
  }).join('');
  const el=document.getElementById('schedFullList');if(el)el.innerHTML=html;
}

        <button class="ibtn del" onclick="removeTmplStep('${esc(cat)}',${i})" title="刪除"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>

function addTmplStep(cat){
  const input=document.getElementById('tmplNew-'+cat);if(!input)return;const v=input.value.trim();if(!v)return;

}
function insertTmplStep(cat,idx){
  if(!db.categoryStageTemplates[cat])db.categoryStageTemplates[cat]=[];
  db.categoryStageTemplates[cat].splice(idx+1,0,'');
  saveData();_tmplFocusKey=`tmplStep-${cat}-${idx+1}`;renderStageTemplateList();

function updateTmplStep(cat,idx,val){
  if(!db.categoryStageTemplates[cat])return;db.categoryStageTemplates[cat][idx]=val.trim();saveData();
}
function removeTmplStep(cat,idx){
  if(!db.categoryStageTemplates[cat])return;db.categoryStageTemplates[cat].splice(idx,1);saveData();renderStageTemplateList();
}
/* ══ 拖曳排序引擎（滑鼠 + 觸控通用，Pointer Events）══
   邏輯：抓住把手(pointerdown) → 移動時判斷懸停在哪一列的上/下半部(pointermove) → 放開時提交排序(pointerup)
   取代舊版 HTML5 draggable（iPhone Safari 不支援觸控觸發 dragstart，這是排序功能在 iPhone 上完全沒反應的原因） */
let ptrDrag=null;
function ptrDragBegin(e,rowSelector,payload,onCommit){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const row=e.currentTarget.closest(rowSelector);
  if(!row)return;
  e.preventDefault();
  row.classList.add('dragging');
  ptrDrag={rowSelector,payload,row,onCommit,overRow:null};
  document.addEventListener('pointermove',ptrDragMove,{passive:false});
  document.addEventListener('pointerup',ptrDragFinish);
  document.addEventListener('pointercancel',ptrDragFinish);
}
function ptrDragMove(e){
  if(!ptrDrag)return;
  e.preventDefault();
  const{rowSelector,row}=ptrDrag;
  const pt=e.touches?.[0]||e;
  const under=document.elementFromPoint(pt.clientX,pt.clientY);
  const hover=under?.closest(rowSelector);
  document.querySelectorAll('.drag-over-top,.drag-over-bot').forEach(x=>{if(x!==hover)x.classList.remove('drag-over-top','drag-over-bot');});
  if(!hover||hover===row){ptrDrag.overRow=null;return;}
  const r=hover.getBoundingClientRect();
  hover.classList.remove('drag-over-top','drag-over-bot');
  hover.classList.add(pt.clientY<r.top+r.height/2?'drag-over-top':'drag-over-bot');
  ptrDrag.overRow=hover;
}
function ptrDragFinish(){
  if(!ptrDrag)return;
  document.removeEventListener('pointermove',ptrDragMove);
  document.removeEventListener('pointerup',ptrDragFinish);
  document.removeEventListener('pointercancel',ptrDragFinish);
  const{row,overRow,payload,onCommit}=ptrDrag;
  row.classList.remove('dragging');
  document.querySelectorAll('.drag-over-top,.drag-over-bot').forEach(x=>x.classList.remove('drag-over-top','drag-over-bot'));
  ptrDrag=null;
  if(overRow)onCommit(payload,overRow);
}

/* ── 排序提交：審查階段範本 ── */
function commitTmplReorder(payload,overRow){
  const{cat,idx:fromIdx}=payload;
  if(overRow.dataset.cat!==cat)return;
  const targetIdx=parseInt(overRow.dataset.idx);
  if(targetIdx===fromIdx)return;
  const isTop=overRow.classList.contains('drag-over-top');
  const arr=db.categoryStageTemplates[cat];if(!arr)return;
  const[item]=arr.splice(fromIdx,1);
  const insertAt=isTop?(fromIdx<targetIdx?targetIdx-1:targetIdx):(fromIdx>targetIdx?targetIdx+1:targetIdx);
  arr.splice(insertAt,0,item);
  saveData();renderStageTemplateList();
}

/* ── 排序提交：案件 ── */
function commitCaseReorder(dragId,overRow){
  const targetId=overRow.id.replace('ci-','');
  if(dragId===targetId)return;
  const isTop=overRow.classList.contains('drag-over-top');
  const fromIdx=db.cases.findIndex(c=>c.id===dragId);
  const toIdx=db.cases.findIndex(c=>c.id===targetId);
  if(fromIdx<0||toIdx<0)return;
  const[item]=db.cases.splice(fromIdx,1);
  const insertAt=isTop?(fromIdx<toIdx?toIdx-1:toIdx):(fromIdx>toIdx?toIdx+1:toIdx);
  db.cases.splice(insertAt,0,item);
  sortKey='custom';
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.toggle('active',b.getAttribute('data-key')==='custom'));
  saveData();renderCasesList();
}

/* ── 排序提交：案件內聯絡人 ── */
function commitRefReorder(payload,overRow){
  const{caseId,refId:dragRefId}=payload;
  const targetRefId=overRow.id.replace('ct-','');
  if(dragRefId===targetRefId)return;
  const c=db.cases.find(c=>c.id===caseId);if(!c)return;
  const isTop=overRow.classList.contains('drag-over-top');
  const refs=c.contactRefs;
  const fromIdx=refs.findIndex(r=>r.id===dragRefId);
  const toIdx=refs.findIndex(r=>r.id===targetRefId);
  if(fromIdx<0||toIdx<0)return;
  const[item]=refs.splice(fromIdx,1);
  refs.splice(isTop?(fromIdx<toIdx?toIdx-1:toIdx):(fromIdx>toIdx?toIdx+1:toIdx),0,item);
  saveData();renderCasesRP();
}

/* ── 排序提交：名冊 ── */
function commitDirReorder(dragId,overRow){
  const targetId=overRow.id.replace('dct-','');
  if(dragId===targetId)return;
  const isTop=overRow.classList.contains('drag-over-top');
  const fromIdx=db.contacts.findIndex(c=>c.id===dragId);
  const toIdx=db.contacts.findIndex(c=>c.id===targetId);
  if(fromIdx<0||toIdx<0)return;
  const[item]=db.contacts.splice(fromIdx,1);
  db.contacts.splice(isTop?(fromIdx<toIdx?toIdx-1:toIdx):(fromIdx>toIdx?toIdx+1:toIdx),0,item);

}

/* ── 排序提交：類別 ── */
function commitCatReorder(dragCat,overRow){
  const targetCat=overRow.dataset.cat;
  if(dragCat===targetCat)return;
  const isTop=overRow.classList.contains('drag-over-top');
  const cats=db.categories;
  const fromIdx=cats.indexOf(dragCat);
  const toIdx=cats.indexOf(targetCat);
  if(fromIdx<0||toIdx<0)return;
  cats.splice(fromIdx,1);
  cats.splice(isTop?(fromIdx<toIdx?toIdx-1:toIdx):(fromIdx>toIdx?toIdx+1:toIdx),0,dragCat);
  saveData();renderCatList();
}

function saveCase(){
  const name=document.getElementById('caseName').value.trim();
  if(!name){showToast('⚠ 請輸入案件名稱','warn');return;}
  const id=document.getElementById('caseId').value;
  const category=document.getElementById('caseCat').value;
  const status=document.getElementById('caseStatus').value;
  const note=document.getElementById('caseNote').value.trim();
  if(id){
    const c=db.cases.find(c=>c.id===id);
    if(c){
      const catChanged=c.category!==category;
      c.name=name;c.category=category;c.status=status;c.note=note;
      if(catChanged&&(!c.stages||!c.stages.length))applyStageTemplate(c);
    }
  }
  else{const nc={id:uid(),name,category,status,note,memo:'',milestones:[],stages:[],contactRefs:[],createdAt:Date.now()};applyStageTemplate(nc);db.cases.unshift(nc);selId=nc.id;}
  saveData();syncLayoutMode();renderCatChips();renderCasesList();if(selId)renderCasesRP();closeMo('caseModal');showToast(id?'✓ 案件已更新':'✓ 案件已新增');
}
function deleteCase(id){
  const c=db.cases.find(c=>c.id===id);if(!c||!confirm(`確定刪除案件「${c.name}」？`))return;
  db.cases=db.cases.filter(c=>c.id!==id);if(selId===id)selId=null;
  syncLayoutMode();saveData();renderCasesList();renderCasesRP();showToast('案件已刪除','warn');
}

/* ══ 案件進度（依類別範本，可個別調整）══ */
function applyStageTemplate(c){
  const tmpl=(c.category&&db.categoryStageTemplates[c.category])||[];
  c.stages=tmpl.map(label=>({id:uid(),label,done:false}));
}
function templateStepsRemaining(c){
  if(!c.category)return[];
  const tmpl=db.categoryStageTemplates[c.category]||[];
  const existing=new Set((c.stages||[]).map(s=>s.label));
  return tmpl.filter(label=>!existing.has(label));
}
function addStageFromTemplate(caseId,label){
  const c=db.cases.find(c=>c.id===caseId);if(!c||!label)return;
  if(!c.stages)c.stages=[];
  c.stages.push({id:uid(),label,done:false});
  saveData();renderCasesRP();
}
function applyRemainingTemplateSteps(caseId){
  const c=db.cases.find(c=>c.id===caseId);if(!c)return;
  const remaining=templateStepsRemaining(c);
  if(!remaining.length)return;
  if(!c.stages)c.stages=[];
  remaining.forEach(label=>c.stages.push({id:uid(),label,done:false}));
  saveData();renderCasesRP();showToast(`✓ 已套用範本 ${remaining.length} 個步驟`);
}
function toggleStage(caseId,stageId){
  const c=db.cases.find(c=>c.id===caseId);if(!c)return;const s=(c.stages||[]).find(s=>s.id===stageId);if(!s)return;
  s.done=!s.done;saveData();renderCasesRP();
}
function addStageStep(caseId){
  const input=document.getElementById('newStageInput-'+caseId);if(!input)return;
  const label=input.value.trim();if(!label)return;
  const c=db.cases.find(c=>c.id===caseId);if(!c)return;
  if(!c.stages)c.stages=[];c.stages.push({id:uid(),label,done:false});
  input.value='';
  saveData();renderCasesRP();
}
function deleteStageStep(caseId,stageId){
  const c=db.cases.find(c=>c.id===caseId);if(!c)return;
  c.stages=(c.stages||[]).filter(s=>s.id!==stageId);saveData();renderCasesRP();
}

function addCategory(){
  const val=document.getElementById('newCatInput').value.trim();if(!val)return;
  if(db.categories.includes(val)){showToast('⚠ 此類別已存在','warn');return;}
  db.categories.push(val);document.getElementById('newCatInput').value='';
  saveData();renderCatChips();renderCatList();renderStageTemplateList();showToast(`✓ 已新增類別「${val}」`);
}
function deleteCat(cat){
  const used=db.cases.filter(c=>c.category===cat).length;
  if(!confirm(used?`有 ${used} 個案件使用此類別，刪除後將清空。確定？`:`確定刪除「${cat}」？`))return;
  if(used)db.cases.forEach(c=>{if(c.category===cat)c.category='';});
  db.categories=db.categories.filter(c=>c!==cat);
  if(db.categoryStageTemplates)delete db.categoryStageTemplates[cat];
  saveData();renderCatChips();renderCatList();renderCasesList();renderStageTemplateList();showToast('類別已刪除','warn');
}

/* ══ Copy / Toast ══ */
function copyText(text,label){
  navigator.clipboard.writeText(text)
    .then(()=>showToast(`✓ ${label} 已複製`))
    .catch(()=>showToast('複製失敗','warn'));
}

// 事件委派：處理所有 data-copy 按鈕
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-copy]');
  if(!btn)return;
  e.stopPropagation();
  const text=btn.getAttribute('data-copy');
  const label=btn.getAttribute('data-label')||'';
  if(!text)return;
  navigator.clipboard.writeText(text)
    .then(()=>showToast(`✓ ${label} 已複製`))
    .catch(()=>{
      // fallback for older browsers
      const ta=document.createElement('textarea');
      ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');showToast(`✓ ${label} 已複製`);}
      catch{showToast('複製失敗，請手動選取','warn');}
      document.body.removeChild(ta);
    });
});
let _tt;
function showToast(msg,type){
  const t=document.getElementById('toast');t.style.display='flex';t.style.animation='none';t.offsetHeight;t.style.animation='tsi .2s ease';
  t.innerHTML=`<span style="color:${type==='warn'?'var(--warn)':'var(--ok)'}">●</span><span>${esc(msg)}</span>`;
  clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',type==='warn'?4000:2800);
}

    try{

      db.cases.forEach(c=>{if(!c.status)c.status='進行中';if(!c.milestones)c.milestones=[];if(!c.stages)c.stages=[];if(!c.contactRefs)c.contactRefs=[];if(c.memo==null)c.memo='';if(!c.createdAt)c.createdAt=Date.now();c.contactRefs.forEach(ref=>{if(!ref.logs)ref.logs=[];});});

}

/* ══ Word 匯出（瀏覽器端載入 docx 函式庫產生 .docx）══ */
let _docxLibPromise=null;
function loadDocxLib(){
  if(window.docx)return Promise.resolve(window.docx);
  if(_docxLibPromise)return _docxLibPromise;
  _docxLibPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js';
    s.onload=()=>window.docx?resolve(window.docx):reject(new Error('docx 未正確載入'));
    s.onerror=()=>reject(new Error('docx 函式庫載入失敗'));
    document.head.appendChild(s);
  });
  return _docxLibPromise;
}
async function exportWordCase(caseId){
  const c=db.cases.find(c=>c.id===caseId);if(!c)return;
  showToast('正在產生 Word 報告…');
  let docx;try{docx=await loadDocxLib();}catch{showToast('⚠ 無法載入 Word 匯出元件，請檢查網路連線','warn');return;}
  const{Document,Packer,Paragraph,TextRun,HeadingLevel,Table,TableRow,TableCell,WidthType,ShadingType}=docx;
  const children=[
    new Paragraph({text:c.name,heading:HeadingLevel.HEADING_1}),
    new Paragraph({children:[new TextRun({text:`類別：${c.category||'未分類'}　狀態：${c.status||'進行中'}`,size:21,color:'666666'})]})
  ];
  if(c.note)children.push(new Paragraph({children:[new TextRun({text:c.note,italics:true,size:20,color:'888888'})]}));
  children.push(new Paragraph({text:''}));
  if((c.stages||[]).length){
    children.push(new Paragraph({text:'案件進度',heading:HeadingLevel.HEADING_2}));
    c.stages.forEach(s=>children.push(new Paragraph({children:[new TextRun({text:(s.done?'☑ ':'☐ ')+s.label,size:21})]})));
    children.push(new Paragraph({text:''}));
  }
  if((c.milestones||[]).length){
    children.push(new Paragraph({text:'期程',heading:HeadingLevel.HEADING_2}));
    [...c.milestones].sort((a,b)=>a.date.localeCompare(b.date)).forEach(m=>children.push(new Paragraph({children:[new TextRun({text:`${msDateStr(m)}　${m.label}`,size:21})]})));
    children.push(new Paragraph({text:''}));
  }
  const refs=c.contactRefs||[];
  if(refs.length){
    children.push(new Paragraph({text:'聯絡人',heading:HeadingLevel.HEADING_2}));
    const colW=[1300,1200,1300,1300,1500,1700,900];
    const mkCell=(t,head)=>new TableCell({width:{size:0,type:WidthType.AUTO},shading:head?{type:ShadingType.CLEAR,fill:'E7ECF7'}:undefined,children:[new Paragraph({children:[new TextRun({text:t,bold:!!head,size:18})]})]});
    const headerRow=new TableRow({tableHeader:true,children:['姓名','身份/職位','角色類別','電話','Email','說明','案件備註'].map(h=>mkCell(h,true))});
    const rows=[headerRow];
    refs.forEach(ref=>{
      const ct=getGContact(ref);
      rows.push(new TableRow({children:[ct.name+(ref.primary?' ★':''),ct.role||'',ct.contactType||'',ct.phone||'',ct.email||'',ct.description||'',ref.caseNote||''].map(v=>mkCell(v,false))}));
    });
    children.push(new Table({rows,width:{size:9200,type:WidthType.DXA},columnWidths:colW}));
    children.push(new Paragraph({text:''}));
    if(refs.some(r=>(r.logs||[]).length)){
      children.push(new Paragraph({text:'聯絡記錄',heading:HeadingLevel.HEADING_2}));
      refs.forEach(ref=>{
        const logs=(ref.logs||[]).sort((a,b)=>b.date.localeCompare(a.date));
        if(!logs.length)return;
        const ct=getGContact(ref);
        children.push(new Paragraph({children:[new TextRun({text:ct.name,bold:true,size:20})]}));
        logs.forEach(l=>children.push(new Paragraph({children:[new TextRun({text:`${l.date}　`,bold:true,size:18}),new TextRun({text:l.content,size:18})]})));
      });
      children.push(new Paragraph({text:''}));
    }
  }
  if(c.memo){
    children.push(new Paragraph({text:'備忘欄',heading:HeadingLevel.HEADING_2}));
    c.memo.split('\n').forEach(line=>children.push(new Paragraph({children:[new TextRun({text:line||' ',size:20})]})));
  }
  const doc=new Document({sections:[{properties:{},children}]});
  const blob=await Packer.toBlob(doc);
  dlBlob(blob,`${c.name}_案件報告_${today()}.docx`);
  showToast('✓ Word 報告已匯出');
}
async function exportWordAll(){

  showToast('正在產生 Word 彙整…');
  let docx;try{docx=await loadDocxLib();}catch{showToast('⚠ 無法載入 Word 匯出元件，請檢查網路連線','warn');return;}

  const children=[
    new Paragraph({text:'案件彙整清單',heading:HeadingLevel.HEADING_1}),
    new Paragraph({children:[new TextRun({text:`匯出日期：${today()}　共 ${db.cases.length} 筆案件`,size:20,color:'888888'})]}),
    new Paragraph({text:''})
  ];
  const headers=['案件名稱','類別','狀態','主要聯絡人','電話','最近期程'];
  const colW=[2400,1200,1000,1500,1500,2000];
  const mkCell=(t,head)=>new TableCell({width:{size:0,type:WidthType.AUTO},shading:head?{type:ShadingType.CLEAR,fill:'E7ECF7'}:undefined,children:[new Paragraph({children:[new TextRun({text:t,bold:!!head,size:18})]})]});
  const rows=[new TableRow({tableHeader:true,children:headers.map(h=>mkCell(h,true))})];

  db.cases.forEach(c=>{
    const msStr=(c.milestones||[]).map(m=>`${m.label}(${msDateStr(m)})`).join('；');
    const refs=c.contactRefs||[];
    if(!refs.length){rows.push([c.name,c.category||'',c.status||'',c.note||'',msStr,'','','','','','','','','']);return;}
    refs.forEach(ref=>{const ct=getGContact(ref);rows.push([c.name,c.category||'',c.status||'',c.note||'',msStr,ct.name,ct.role||'',ct.contactType||'',ct.description||'',ct.phone||'',ct.email||'',ct.note||'',ref.caseNote||'',ref.primary?'是':'']);});
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  dlBlob(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),`contact_control_${today()}.csv`);showToast('✓ CSV 匯出完成');
}

/* ══ Fetch JSON from GitHub ══ */
async function tryFetchJSON(){
  setDsPill('loading','讀取中…');
  try{
    const res=await fetch('./contact_control.json',{cache:'no-cache'});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    let raw;
    try{raw=await res.json();}catch{throw new Error('JSON 格式錯誤');}
    // Validate required fields
    if(!raw||typeof raw!=='object')throw new Error('資料格式異常');
    if(!Array.isArray(raw.cases))throw new Error('缺少 cases 欄位');
    if(!Array.isArray(raw.contacts))raw.contacts=[];
    if(!Array.isArray(raw.categories))raw.categories=[...DEF_CATS];
    if(!raw.categoryStageTemplates||typeof raw.categoryStageTemplates!=='object')raw.categoryStageTemplates={};
    if(!Array.isArray(raw.companyMilestones))raw.companyMilestones=[];
    // Migrate old contacts[] → contactRefs[] + global contacts directory
    raw.cases.forEach(c=>{
      if(!c.id)c.id=uid();
      if(!c.status)c.status='進行中';
      if(!c.milestones)c.milestones=[];
      if(!c.stages)c.stages=[];
      if(c.memo==null)c.memo='';
      if(!c.createdAt)c.createdAt=Date.now();
      // 舊格式遷移
      if(c.contacts&&!c.contactRefs){
        c.contactRefs=c.contacts.map(ct=>{
          // 先找全域名冊是否已有同名+同電話
          let gct=raw.contacts.find(g=>
            g.name===ct.name&&(g.phone===ct.phone||(!g.phone&&!ct.phone))
          );
          if(!gct){
            gct={
              id:ct.id||uid(),
              name:ct.name||'',
              role:ct.role||'',
              contactType:ct.contactType||'',
              description:ct.description||'',
              phone:ct.phone||'',
              email:ct.email||'',
              note:ct.note||'',
              createdAt:Date.now()
            };
            raw.contacts.push(gct);
          }
          return{
            id:uid(),
            contactId:gct.id,
            primary:!!ct.primary,
            caseNote:'',
            logs:ct.logs||[]
          };
        });
        delete c.contacts;
      }
      if(!c.contactRefs)c.contactRefs=[];
      c.contactRefs.forEach(ref=>{if(!ref.logs)ref.logs=[];});
    });
    raw.contacts.forEach(ct=>{if(!ct.id)ct.id=uid();});
    db=raw;
    // Also save to localStorage as cache
    localStorage.setItem(SK,JSON.stringify(cleanDb()));
    updateStorage();
    const ts=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    setDsPill('github',`GitHub · ${ts}`);
    return true;
  }catch(err){
    console.warn('fetch JSON failed:',err.message);
    return false;
  }
}

/* ══ Password System ══ */
const PWD_KEY='cc_pwd_h';
const SES_KEY='cc_ses';

async function hashPwd(pwd){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch{return btoa(pwd+':cc_salt_2025');}
}

function togglePwdView(inputId,btn){
  const inp=document.getElementById(inputId);if(!inp)return;
  const hide=inp.type==='password';inp.type=hide?'text':'password';
  btn.style.opacity=hide?'1':'.5';
}

async function checkAuth(){
  const storedHash=localStorage.getItem(PWD_KEY);
  if(!storedHash)return true;
  const sesHash=sessionStorage.getItem(SES_KEY);
  if(sesHash===storedHash)return true;
  showLoginScreen();return false;
}

function showLoginScreen(){
  const ol=document.getElementById('loginOverlay');ol.style.display='flex';
  document.getElementById('loginErr').textContent='';
  document.getElementById('pwdInput').value='';
  setTimeout(()=>document.getElementById('pwdInput').focus(),250);
}

async function doLogin(){
  const pwd=document.getElementById('pwdInput').value;
  const errEl=document.getElementById('loginErr');
  if(!pwd){errEl.textContent='請輸入密碼';return;}
  const hash=await hashPwd(pwd);
  if(hash===localStorage.getItem(PWD_KEY)){
    sessionStorage.setItem(SES_KEY,hash);
    document.getElementById('loginOverlay').style.display='none';
    errEl.textContent='';
  }else{
    errEl.textContent='密碼錯誤，請再試一次';
    document.getElementById('pwdInput').select();
  }
}

function forgotPwd(){
  if(!confirm('忘記密碼將清除所有本機資料並移除密碼保護。\n\n⚠ 此操作無法復原（GitHub 上的 JSON 備份不受影響）\n\n確定繼續？'))return;
  localStorage.clear();sessionStorage.clear();location.reload();
}

function openSetPwd(){
  const hasPwd=!!localStorage.getItem(PWD_KEY);
  document.getElementById('setPwdMT').textContent=hasPwd?'變更密碼':'設定密碼';
  document.getElementById('newPwd1').value='';
  document.getElementById('newPwd2').value='';
  document.getElementById('setPwdErr').textContent='';
  openMo('setPwdModal');
  setTimeout(()=>document.getElementById('newPwd1').focus(),80);
}

async function doSetPwd(){
  const p1=document.getElementById('newPwd1').value;
  const p2=document.getElementById('newPwd2').value;
  const errEl=document.getElementById('setPwdErr');
  if(!p1||p1.length<4){errEl.textContent='密碼至少需要 4 個字元';return;}
  if(p1!==p2){errEl.textContent='兩次輸入的密碼不一致';return;}
  const hash=await hashPwd(p1);
  localStorage.setItem(PWD_KEY,hash);sessionStorage.setItem(SES_KEY,hash);
  closeMo('setPwdModal');updatePwdStatus();
  showToast('✓ 密碼已設定，下次開啟時需要登入');
}

function removePwd(){
  if(!confirm('確定移除密碼保護？'))return;
  localStorage.removeItem(PWD_KEY);sessionStorage.removeItem(SES_KEY);
  updatePwdStatus();showToast('密碼已移除','warn');
}

function updatePwdStatus(){
  const hasPwd=!!localStorage.getItem(PWD_KEY);
  const s=document.getElementById('pwdStatus');
  const lb=document.getElementById('pwdBtnLabel');
  const rb=document.getElementById('removePwdBtn');
  if(!s)return;
  s.innerHTML=hasPwd
    ?`<div class="pwd-dot-on"></div><span style="color:var(--ok);font-size:14px;font-weight:600">已啟用</span><span style="font-size:13px;color:var(--txm);margin-left:4px">· 下次開啟需要登入</span>`
    :`<div class="pwd-dot-off"></div><span style="font-size:14px;color:var(--txm)">未設定</span>`;
  if(lb)lb.textContent=hasPwd?'變更密碼':'設定密碼';
  if(rb)rb.style.display=hasPwd?'inline-flex':'none';
}

/* ══ Init (async) ══ */
async function init(){
  // 1. 主題先套用（讓登入畫面有正確顏色）
  setThemeMode(themeMode);
  // 2. 驗證密碼
  const authed=await checkAuth();
  if(!authed){
    // 等使用者登入後才繼續（doLogin 驗證成功後整頁已顯示）
    // 監聽登入完成後初始化主程式
    const observer=new MutationObserver(()=>{
      if(document.getElementById('loginOverlay').style.display==='none'){
        observer.disconnect();bootApp();
      }
    });
    observer.observe(document.getElementById('loginOverlay'),{attributes:true,attributeFilter:['style']});
    return;
  }
  bootApp();
}

async function bootApp(){
  const fromGitHub=await tryFetchJSON();
  if(!fromGitHub){
    loadData();
    const hasLocal=!!localStorage.getItem(SK);
    setDsPill('local',hasLocal?'本機資料':'無資料');
  }
  updateStorage();
  setView('cases');
  setInterval(()=>{if(themeMode==='auto')applyTheme();},60000);
}

function visDirCts(){
  const q=(document.getElementById('searchDir')?.value||'').toLowerCase();
  let cts=[...db.contacts];
  if(q)cts=cts.filter(c=>c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.email||'').toLowerCase().includes(q)||(c.lineId||'').toLowerCase().includes(q)||(c.description||'').toLowerCase().includes(q)||(c.note||'').toLowerCase().includes(q)||(c.role||'').toLowerCase().includes(q)||(c.contactType||'').toLowerCase().includes(q));
  return cts;
}
function moveSelection(dir){
  if(view==='cases'){
    const list=visCases();if(!list.length)return;
    let idx=list.findIndex(c=>c.id===selId);
    idx=idx===-1?(dir>0?0:list.length-1):Math.min(list.length-1,Math.max(0,idx+dir));
    selCase(list[idx].id);
    document.getElementById('ci-'+list[idx].id)?.scrollIntoView({block:'nearest'});
  }else if(view==='directory'){
    const list=visDirCts();if(!list.length)return;
    let idx=list.findIndex(c=>c.id===selDirId);
    idx=idx===-1?(dir>0?0:list.length-1):Math.min(list.length-1,Math.max(0,idx+dir));
    selDir(list[idx].id);
    document.getElementById('dct-'+list[idx].id)?.scrollIntoView({block:'nearest'});
  }
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.querySelectorAll('.mo.open').forEach(m=>m.classList.remove('open'));
  if(document.querySelector('.mo.open'))return;
  if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();if(view==='cases')openCaseModal();else if(view==='directory')openGContactModal();}
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if(typing)return;
  if(e.key==='/'){
    const id=view==='cases'?'searchCase':view==='directory'?'searchDir':null;
    if(id){e.preventDefault();document.getElementById(id)?.focus();}
  }else if((e.key==='ArrowDown'||e.key==='ArrowUp')&&(view==='cases'||view==='directory')){
    e.preventDefault();moveSelection(e.key==='ArrowDown'?1:-1);
  }
});

init();
</script>
